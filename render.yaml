services:
  - type: worker
    name: ride-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: RIDE_API_URL
        value: https://ride-api.fly.dev
      - key: DRY_RUN
        value: "true"
      - key: KILL_SWITCH
        value: "false"
      - key: RPC_URL
        sync: false
      - key: BOT_KEYPAIR
        sync: false
      - key: BOT_WALLET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

